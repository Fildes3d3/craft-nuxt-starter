# =============================================================================
# craft-nuxt-starter — local dev routing
#
#   /            → Nuxt dev server (HMR via websocket upgrade)
#   /admin       → Craft control panel
#   /api         → Craft GraphQL endpoint
#   /cpresources → Craft CP assets
# =============================================================================

# WebSocket upgrade handling — keeps keep-alive for normal requests and
# only sends "Connection: upgrade" when the client actually upgrades (HMR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── Craft CMS ────────────────────────────────────────────────────────────
    location /admin {
        root /app/backend/web;
        try_files $uri/index.html $uri $uri/ /index.php?$query_string;
    }

    location /cpresources {
        root /app/backend/web;
        try_files $uri/index.html $uri $uri/ /index.php?$query_string;
    }

    location /index.php {
        root /app/backend/web;
        try_files $uri/index.html $uri $uri/ /index.php?$query_string;
    }

    # Craft GraphQL API
    location /api {
        root /app/backend/web;
        try_files $uri/index.html $uri $uri/ /index.php?$query_string;
    }

    # Craft asset uploads
    location /uploads {
        root /app/backend/web;
        access_log off;
        expires 7d;
    }

    location ~ [^/]\.php(/|$) {
        root /app/backend/web;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTP_PROXY      "";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # ── Nuxt (everything else) ───────────────────────────────────────────────
    location / {
        proxy_pass         http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache_bypass 1;
        proxy_no_cache     1;
    }
}
